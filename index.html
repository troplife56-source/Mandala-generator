<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Mandalas Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --danger-color: #f43f5e;
            --select-color: #f59e0b;
            --color-picker-mode: #10b981;
            --free-brush-color: #a855f7;
            --border-color: #334155;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-bottom: 2px;
            font-size: 1.4rem;
            text-align: center;
        }

        p.subtitle {
            color: #94a3b8;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 0.85rem;
            text-align: center;
        }

        .main-container {
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;
            gap: 20px;
            max-width: 1250px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
        }

        .canvas-container {
            background: #000;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--border-color);
            position: relative;
            flex-shrink: 0;
        }

        canvas {
            display: block;
            background: #000;
            cursor: crosshair;
            width: 100%;
            max-width: 700px;
            height: auto;
        }

        .zoom-info {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #38bdf8;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            pointer-events: none;
        }

        .controls-panel {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 380px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border: 1px solid var(--border-color);
            max-height: 85vh;
            overflow-y: auto;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
        }

        select, input[type="range"], input[type="color"] {
            width: 100%;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: white;
            font-size: 0.85rem;
            box-sizing: border-box;
        }

        input[type="color"] {
            height: 32px;
            padding: 2px;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #0f172a;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            cursor: pointer;
        }

        .checkbox-group input {
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .checkbox-group label {
            cursor: pointer;
            color: var(--free-brush-color);
            margin: 0;
        }

        .mode-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #0f172a;
            padding: 4px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            gap: 4px;
        }

        .mode-btn {
            padding: 7px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            text-align: center;
        }

        .mode-btn.active {
            background: var(--accent-color);
            color: #0f172a;
        }

        .mode-btn.active.select-active {
            background: var(--select-color);
            color: #0f172a;
        }

        .mode-btn.active.eraser-active {
            background: var(--danger-color);
            color: white;
        }

        .mode-btn.active.color-active {
            background: var(--color-picker-mode);
            color: white;
        }

        .mode-btn.active.free-brush-active {
            background: var(--free-brush-color);
            color: white;
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.8rem;
        }

        .btn-primary { background: var(--accent-color); color: #0f172a; }
        .btn-warning { background: var(--select-color); color: #0f172a; }
        .btn-danger { background: var(--danger-color); color: white; }
        .btn-secondary { background: #475569; color: white; }

        /* Media Query Responsive pour tablettes et smartphones */
        @media (max-width: 1050px) {
            .main-container {
                flex-direction: column;
                align-items: center;
            }
            .controls-panel {
                width: 100%;
                max-width: 700px;
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <h1>Générateur de Mandalas Pro</h1>
    <p class="subtitle">Studio fluide avec grand espace de dessin et disposition adaptative</p>

    <div class="main-container">
        <div class="canvas-container">
            <canvas id="mandalaCanvas" width="700" height="700"></canvas>
            <div class="zoom-info" id="zoomInfo">Mode: Placer Forme | Zoom: 100%</div>
        </div>

        <div class="controls-panel">
            <div class="control-group">
                <label>Outil / Mode actif :</label>
                <div class="mode-selector">
                    <button class="mode-btn active" id="modePlace">Placer Forme</button>
                    <button class="mode-btn" id="modeSelect">🔍 Sélectionner</button>
                    <button class="mode-btn" id="modeDrawLine">📏 Ligne (2 clics)</button>
                    <button class="mode-btn" id="modeDrawArc">🌙 Arc (3 clics)</button>
                    <button class="mode-btn" id="modeColorize">🖌️ Pinceau Sym.</button>
                    <button class="mode-btn" id="modeFreeBrush">✏️ Pinceau Libre</button>
                    <button class="mode-btn" id="modeErase" style="grid-column: span 2;">Effacer 🎯</button>
                </div>
            </div>

            <div class="btn-row">
                <button class="btn-secondary" id="undoBtn">↩️ Annuler</button>
                <button class="btn-secondary" id="redoBtn">↪️ Rétablir</button>
            </div>

            <div style="background:#0f172a; padding:8px; border-radius:6px; border:1px solid var(--border-color);">
                <label style="color:var(--accent-color); margin-bottom:4px; display:block;">Animation & Vidéo (MP4) :</label>
                <div class="btn-row" style="margin-bottom:6px;">
                    <button class="btn-primary" id="playAnimBtn">▶️ Play / Pause</button>
                    <button class="btn-warning" id="recordVideoBtn" title="Enregistrer une vidéo MP4 de 6 secondes">🎥 Enregistrer MP4 (6s)</button>
                </div>
                <div class="control-group">
                    <label for="animSpeed">Vitesse de rotation : <span id="speedVal">1</span>x</label>
                    <input type="range" id="animSpeed" min="-20" max="20" value="1" step="0.5">
                </div>
            </div>

            <div id="shapesControls">
                <div class="control-group">
                    <label for="shapeSelect">Bibliothèque de formes :</label>
                    <select id="shapeSelect">
                        <option value="circle">Cercle parfait</option>
                        <option value="square">Carré</option>
                        <option value="triangle">Triangle équilatéral</option>
                        <option value="diamond">Losange (Diamant)</option>
                        <option value="hexagon" selected>Hexagone (6 côtés)</option>
                        <option value="octagon">Octogone (8 côtés)</option>
                        <option value="star5">Étoile à 5 branches</option>
                        <option value="star6">Étoile à 6 branches</option>
                        <option value="rosace">Rosace géométrique</option>
                    </select>
                </div>

                <div class="control-group" style="margin-top: 4px;">
                    <label for="svgImportInput" style="cursor:pointer; background:#1e293b; border:1px dashed var(--accent-color); padding:6px; border-radius:6px; text-align:center; display:block; color:var(--accent-color); font-size:0.8rem;">
                        📁 Importer un fichier SVG...
                    </label>
                    <input type="file" id="svgImportInput" accept=".svg" style="display:none;">
                </div>

                <div class="checkbox-group" style="border-color: var(--free-brush-color); margin-top: 4px;">
                    <input type="checkbox" id="isFreePlacement">
                    <label for="isFreePlacement">Insérer sans symétrie (Forme unique)</label>
                </div>

                <div class="btn-row" style="margin-top: 6px;">
                    <button class="btn-warning" id="centerShapeBtn" style="font-size: 0.8rem; padding: 7px;">📍 Placer sur le canvas</button>
                </div>

                <div class="control-group" style="margin-top: 4px;">
                    <label for="strokeWidth">Épaisseur du tracé : <span id="strokeWidthVal">2</span>px</label>
                    <input type="range" id="strokeWidth" min="1" max="20" value="2">
                </div>

                <div class="control-group" style="margin-top: 4px;">
                    <label for="shapeSize">Taille : <span id="sizeVal">120</span></label>
                    <input type="range" id="shapeSize" min="10" max="500" value="120">
                </div>

                <div class="control-group">
                    <label for="shapeRotation">Rotation initiale : <span id="rotVal">0</span>°</label>
                    <input type="range" id="shapeRotation" min="0" max="360" value="0">
                </div>
            </div>

            <div id="selectedControls" style="display:none; background:#0f172a; padding:8px; border-radius:6px; border:1px solid var(--select-color);">
                <label style="color:var(--select-color); margin-bottom:6px; display:block;">Forme sélectionnée :</label>
                <div class="btn-row">
                    <button class="btn-danger" id="deleteSelectedBtn">Supprimer cette forme</button>
                </div>
            </div>

            <div id="brushControls" style="display:none; background:#0f172a; padding:8px; border-radius:6px; border:1px solid var(--color-picker-mode);">
                <label style="color:var(--color-picker-mode); margin-bottom:6px; display:block;" id="brushControlTitle">Paramètres Pinceau :</label>
                <div class="control-group">
                    <label for="brushSize">Épaisseur : <span id="brushSizeVal">5</span></label>
                    <input type="range" id="brushSize" min="1" max="50" value="5">
                </div>
            </div>

            <div class="control-group">
                <label for="symmetry">Symétrie pour les prochains (Branches) : <span id="symVal">8</span></label>
                <input type="range" id="symmetry" min="1" max="24" value="8">
            </div>

            <div class="control-group">
                <label for="lineColor">Couleur active :</label>
                <input type="color" id="lineColor" value="#38bdf8">
            </div>

            <div class="control-group">
                <label for="bgColor">Fond :</label>
                <select id="bgColor">
                    <option value="#000000">Noir</option>
                    <option value="#ffffff">Blanc</option>
                </select>
            </div>

            <div class="btn-row">
                <button class="btn-danger" id="resetAllBtn">Tout effacer (0)</button>
                <button class="btn-primary" id="downloadBtn">Télécharger Image</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('mandalaCanvas');
        const ctx = canvas.getContext('2d');
        const zoomInfo = document.getElementById('zoomInfo');

        const brushControls = document.getElementById('brushControls');
        const brushControlTitle = document.getElementById('brushControlTitle');
        const selectedControls = document.getElementById('selectedControls');
        const deleteSelectedBtn = document.getElementById('deleteSelectedBtn');

        const undoBtn = document.getElementById('undoBtn');
        const redoBtn = document.getElementById('redoBtn');
        const playAnimBtn = document.getElementById('playAnimBtn');
        const recordVideoBtn = document.getElementById('recordVideoBtn');
        const animSpeedRange = document.getElementById('animSpeed');
        const speedVal = document.getElementById('speedVal');

        const shapeSelect = document.getElementById('shapeSelect');
        const svgImportInput = document.getElementById('svgImportInput');
        const centerShapeBtn = document.getElementById('centerShapeBtn');
        const strokeWidthRange = document.getElementById('strokeWidth');
        const strokeWidthVal = document.getElementById('strokeWidthVal');
        const isFreePlacementCheckbox = document.getElementById('isFreePlacement');
        const shapeSizeRange = document.getElementById('shapeSize');
        const sizeVal = document.getElementById('sizeVal');
        const shapeRotationRange = document.getElementById('shapeRotation');
        const rotVal = document.getElementById('rotVal');

        const brushSizeRange = document.getElementById('brushSize');
        const brushSizeVal = document.getElementById('brushSizeVal');
        const symmetryRange = document.getElementById('symmetry');
        const symVal = document.getElementById('symVal');
        const lineColorPicker = document.getElementById('lineColor');
        const bgColorSelect = document.getElementById('bgColor');
        const resetAllBtn = document.getElementById('resetAllBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentMode = 'place';
        let shapes = [];
        let brushStrokes = []; 
        let freeBrushStrokes = []; 
        let userLines = [];
        let userArcs = [];
        
        let selectedShapeIdx = null;
        let isDraggingShape = false;
        let isPainting = false;
        let currentBrushStroke = null;
        
        let historyStack = [];
        let redoStack = [];

        let zoomLevel = 1;
        let panX = 0;
        let panY = 0;
        let isPanning = false;
        let startX, startY;

        let isPlaying = false;
        let globalRotationAngle = 0;

        let drawingState = 0;
        let tempStart = { x: 0, y: 0 };
        let tempMid = { x: 0, y: 0 };

        const baseWidth = canvas.width;
        const baseHeight = canvas.height;
        const centerX = baseWidth / 2;
        const centerY = baseHeight / 2;

        function saveState() {
            try {
                historyStack.push({
                    shapes: JSON.parse(JSON.stringify(shapes)),
                    brushStrokes: JSON.parse(JSON.stringify(brushStrokes)),
                    freeBrushStrokes: JSON.parse(JSON.stringify(freeBrushStrokes)),
                    userLines: JSON.parse(JSON.stringify(userLines)),
                    userArcs: JSON.parse(JSON.stringify(userArcs))
                });
                if (historyStack.length > 30) historyStack.shift();
                redoStack = [];
            } catch (err) { console.error("Erreur sauvegarde:", err); }
        }

        undoBtn.addEventListener('click', () => {
            if (historyStack.length === 0) return;
            redoStack.push(JSON.parse(JSON.stringify({ shapes, brushStrokes, freeBrushStrokes, userLines, userArcs })));
            const prev = historyStack.pop();
            shapes = prev.shapes; brushStrokes = prev.brushStrokes; freeBrushStrokes = prev.freeBrushStrokes; userLines = prev.userLines; userArcs = prev.userArcs;
            clearSelection(); redraw();
        });

        redoBtn.addEventListener('click', () => {
            if (redoStack.length === 0) return;
            historyStack.push(JSON.parse(JSON.stringify({ shapes, brushStrokes, freeBrushStrokes, userLines, userArcs })));
            const next = redoStack.pop();
            shapes = next.shapes; brushStrokes = next.brushStrokes; freeBrushStrokes = next.freeBrushStrokes; userLines = next.userLines; userArcs = next.userArcs;
            redraw();
        });

        playAnimBtn.addEventListener('click', () => {
            isPlaying = !isPlaying; playAnimBtn.textContent = isPlaying ? "⏸️ Pause" : "▶️ Play / Pause";
            playAnimBtn.style.background = isPlaying ? '#10b981' : '';
            if (isPlaying) requestAnimationFrame(animateRotation);
        });

        function animateRotation() {
            if (!isPlaying) return; globalRotationAngle += parseFloat(animSpeedRange.value) * 0.01;
            redraw(); requestAnimationFrame(animateRotation);
        }

        recordVideoBtn.addEventListener('click', () => {
            if (!window.MediaRecorder) { alert("Non supporté."); return; }
            const wasPlaying = isPlaying; if (!isPlaying) { isPlaying = true; playAnimBtn.textContent = "⏸️ Pause"; playAnimBtn.style.background = '#10b981'; requestAnimationFrame(animateRotation); }
            recordVideoBtn.disabled = true; recordVideoBtn.textContent = "🔴 Enregistrement...";
            const stream = canvas.captureStream(30);
            let recorder = new MediaRecorder(stream, { mimeType: MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm' });
            let chunks = []; recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: recorder.mimeType }); const url = URL.createObjectURL(blob);
                const a = document.createElement('a'); a.href = url; a.download = `mandala-animation.${recorder.mimeType.includes('mp4')?'mp4':'webm'}`; a.click(); URL.revokeObjectURL(url);
                recordVideoBtn.disabled = false; recordVideoBtn.textContent = "🎥 Enregistrer MP4 (6s)";
                if (!wasPlaying) { isPlaying = false; playAnimBtn.textContent = "▶️ Play / Pause"; playAnimBtn.style.background = ''; }
            }; recorder.start(); setTimeout(() => recorder.stop(), 6000);
        });

        svgImportInput.addEventListener('change', (e) => {
            const file = e.target.files[0]; if (!file) return; const reader = new FileReader();
            reader.onload = function(event) {
                const doc = new DOMParser().parseFromString(event.target.result, 'image/svg+xml'); const paths = doc.querySelectorAll('path');
                if (paths.length === 0) { alert("Aucun tracé SVG."); return; }
                let dData = ""; paths.forEach(p => { const d = p.getAttribute('d'); if (d) dData += " " + d; });
                const customId = 'svg_' + Date.now(); const opt = document.createElement('option');
                opt.value = customId; opt.textContent = `SVG: ${file.name.substring(0, 12)}...`;
                shapeSelect.appendChild(opt); shapeSelect.value = customId;
                window.customSvgPaths = window.customSvgPaths || {}; window.customSvgPaths[customId] = new Path2D(dData.trim());
            }; reader.readAsText(file); svgImportInput.value = "";
        });

        function addShape(type, x, y, size, rotationDeg, strokeWidth, color, isFree, symmetry) {
            shapes.push({ type, x, y, size, rotation: rotationDeg, strokeWidth, color, isFree, symmetry });
        }

        centerShapeBtn.addEventListener('click', () => {
            saveState(); 
            addShape(
                shapeSelect.value, 
                centerX, 
                centerY, 
                parseInt(shapeSizeRange.value), 
                parseInt(shapeRotationRange.value), 
                parseInt(strokeWidthRange.value), 
                lineColorPicker.value,
                isFreePlacementCheckbox.checked,
                parseInt(symmetryRange.value)
            );
            redraw();
        });

        function clearSelection() {
            selectedShapeIdx = null;
            selectedControls.style.display = 'none';
        }

        function setMode(mode) {
            currentMode = mode; 
            ['modePlace', 'modeSelect', 'modeDrawLine', 'modeDrawArc', 'modeColorize', 'modeFreeBrush', 'modeErase'].forEach(id => {
                const btn = document.getElementById(id);
                if(btn) btn.classList.remove('active', 'select-active', 'eraser-active', 'color-active', 'free-brush-active');
            });
            brushControls.style.display = 'none'; drawingState = 0;
            clearSelection();
            
            if (mode === 'place') document.getElementById('modePlace').classList.add('active');
            else if (mode === 'select') document.getElementById('modeSelect').classList.add('active', 'select-active');
            else if (mode === 'drawLine') document.getElementById('modeDrawLine').classList.add('active');
            else if (mode === 'drawArc') document.getElementById('modeDrawArc').classList.add('active');
            else if (mode === 'colorize') { 
                document.getElementById('modeColorize').classList.add('active', 'color-active'); 
                brushControls.style.display = 'block'; 
                brushControlTitle.textContent = "Pinceau Symétrique :"; 
            }
            else if (mode === 'freeBrush') { 
                document.getElementById('modeFreeBrush').classList.add('active', 'free-brush-active'); 
                brushControls.style.display = 'block'; 
                brushControlTitle.textContent = "Pinceau Libre :"; 
            }
            else if (mode === 'erase') document.getElementById('modeErase').classList.add('active', 'eraser-active');
            redraw();
        }

        document.getElementById('modePlace').addEventListener('click', () => setMode('place'));
        document.getElementById('modeSelect').addEventListener('click', () => setMode('select'));
        document.getElementById('modeDrawLine').addEventListener('click', () => setMode('drawLine'));
        document.getElementById('modeDrawArc').addEventListener('click', () => setMode('drawArc'));
        document.getElementById('modeColorize').addEventListener('click', () => setMode('colorize'));
        document.getElementById('modeFreeBrush').addEventListener('click', () => setMode('freeBrush'));
        document.getElementById('modeErase').addEventListener('click', () => setMode('erase'));

        function checkAndRemoveAnything(pt) {
            const threshold = 20 / zoomLevel;

            // Formes
            for (let i = shapes.length - 1; i >= 0; i--) {
                const sh = shapes[i];
                const sym = sh.symmetry || 8;
                const angleStep = (Math.PI * 2) / sym;

                if (sh.isFree) {
                    if (Math.hypot(pt.x - sh.x, pt.y - sh.y) < sh.size / 2) { shapes.splice(i, 1); return true; }
                } else {
                    for (let s = 0; s < sym; s++) {
                        const angle = s * angleStep; const cos = Math.cos(angle), sin = Math.sin(angle);
                        const relX = sh.x - centerX, relY = sh.y - centerY;
                        const sX = centerX + (relX * cos - relY * sin), sY = centerY + (relX * sin + relY * cos);
                        if (Math.hypot(pt.x - sX, pt.y - sY) < sh.size / 2) { shapes.splice(i, 1); return true; }
                    }
                }
            }

            // Lignes droites
            for (let i = userLines.length - 1; i >= 0; i--) {
                const line = userLines[i];
                const sym = line.symmetry || 8;
                const angleStep = (Math.PI * 2) / sym;

                if (line.isFree) {
                    const l2 = Math.hypot(line.x2 - line.x1, line.y2 - line.y1);
                    if (l2 > 0) {
                        let t = ((pt.x - line.x1) * (line.x2 - line.x1) + (pt.y - line.y1) * (line.y2 - line.y1)) / (l2 * l2);
                        t = Math.max(0, Math.min(1, t));
                        if (Math.hypot(pt.x - (line.x1 + t * (line.x2 - line.x1)), pt.y - (line.y1 + t * (line.y2 - line.y1))) < threshold) { userLines.splice(i, 1); return true; }
                    }
                } else {
                    for (let s = 0; s < sym; s++) {
                        const angle = s * angleStep; const cos = Math.cos(angle), sin = Math.sin(angle);
                        const sX1 = centerX + ((line.x1 - centerX) * cos - (line.y1 - centerY) * sin), sY1 = centerY + ((line.x1 - centerX) * sin + (line.y1 - centerY) * cos);
                        const sX2 = centerX + ((line.x2 - centerX) * cos - (line.y2 - centerY) * sin), sY2 = centerY + ((line.x2 - centerX) * sin + (line.y2 - centerY) * cos);
                        const l2 = Math.hypot(sX2 - sX1, sY2 - sY1);
                        if (l2 > 0) {
                            let t = ((pt.x - sX1) * (sX2 - sX1) + (pt.y - sY1) * (sY2 - sY1)) / (l2 * l2);
                            t = Math.max(0, Math.min(1, t));
                            if (Math.hypot(pt.x - (sX1 + t * (sX2 - sX1)), pt.y - (sY1 + t * (sY2 - sY1))) < threshold) { userLines.splice(i, 1); return true; }
                        }
                    }
                }
            }

            // Arcs
            for (let i = userArcs.length - 1; i >= 0; i--) {
                const arc = userArcs[i];
                if (Math.hypot(pt.x - arc.cx, pt.y - arc.cy) < threshold) { userArcs.splice(i, 1); return true; }
            }

            // Pinceaux symétriques
            for (let i = brushStrokes.length - 1; i >= 0; i--) {
                const stroke = brushStrokes[i];
                const sym = stroke.symmetry || 8;
                const angleStep = (Math.PI * 2) / sym;

                for (let s = 0; s < sym; s++) {
                    const angle = s * angleStep; const cos = Math.cos(angle), sin = Math.sin(angle);
                    for (let p = 0; p < stroke.points.length; p++) {
                        const ptStroke = stroke.points[p];
                        const sX = centerX + ((ptStroke.x - centerX) * cos - (ptStroke.y - centerY) * sin);
                        const sY = centerY + ((ptStroke.x - centerX) * sin + (ptStroke.y - centerY) * cos);
                        if (Math.hypot(pt.x - sX, pt.y - sY) < threshold) { brushStrokes.splice(i, 1); return true; }
                    }
                }
            }

            // Pinceaux libres
            for (let i = freeBrushStrokes.length - 1; i >= 0; i--) {
                const stroke = freeBrushStrokes[i];
                for (let p = 0; p < stroke.points.length; p++) {
                    if (Math.hypot(pt.x - stroke.points[p].x, pt.y - stroke.points[p].y) < threshold) { freeBrushStrokes.splice(i, 1); return true; }
                }
            }

            return false;
        }

        function drawSingleShape(ctx, sh, x, y, rotAngle, isSelected = false) {
            ctx.save();
            ctx.strokeStyle = isSelected ? '#f59e0b' : sh.color;
            ctx.lineWidth = (isSelected ? sh.strokeWidth + 2 : sh.strokeWidth) / zoomLevel;

            if (sh.type.startsWith('svg_') && window.customSvgPaths && window.customSvgPaths[sh.type]) {
                ctx.translate(x, y);
                ctx.rotate((rotAngle * Math.PI) / 180);
                const sc = sh.size / 150; ctx.scale(sc, sc);
                ctx.stroke(window.customSvgPaths[sh.type]);
            } else if (sh.type === 'circle') {
                ctx.beginPath(); ctx.arc(x, y, sh.size / 2, 0, Math.PI * 2); ctx.stroke();
            } else {
                const pts = getShapePoints(sh.type, x, y, sh.size, rotAngle);
                ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); pts.forEach(p => ctx.lineTo(p.x, p.y)); ctx.closePath(); ctx.stroke();
            }

            if (currentMode === 'select') {
                ctx.beginPath();
                ctx.arc(x, y, 6 / zoomLevel, 0, Math.PI * 2);
                ctx.fillStyle = isSelected ? '#f59e0b' : 'rgba(56, 189, 248, 0.8)';
                ctx.fill();
                ctx.lineWidth = 1 / zoomLevel;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
            }

            ctx.restore();
        }

        function redraw() {
            try {
                ctx.fillStyle = bgColorSelect.value; 
                ctx.fillRect(0, 0, baseWidth, baseHeight);

                ctx.save(); 
                ctx.translate(baseWidth / 2 + panX, baseHeight / 2 + panY); 
                ctx.scale(zoomLevel, zoomLevel); 
                ctx.rotate(globalRotationAngle); 
                ctx.translate(-centerX, -centerY);

                symVal.textContent = symmetryRange.value;
                if(shapeSizeRange) sizeVal.textContent = shapeSizeRange.value; 
                if(shapeRotationRange) rotVal.textContent = shapeRotationRange.value;
                if(strokeWidthRange) strokeWidthVal.textContent = strokeWidthRange.value;
                if(brushSizeRange) brushSizeVal.textContent = brushSizeRange.value;
                
                // Formes
                shapes.forEach((sh, idx) => {
                    const isSelected = (currentMode === 'select' && selectedShapeIdx === idx);
                    const sym = sh.symmetry || 8;
                    const angleStep = (Math.PI * 2) / sym;

                    if (sh.isFree) {
                        drawSingleShape(ctx, sh, sh.x, sh.y, sh.rotation, isSelected);
                    } else {
                        for (let i = 0; i < sym; i++) {
                            const angle = i * angleStep; const cos = Math.cos(angle), sin = Math.sin(angle);
                            const relX = sh.x - centerX, relY = sh.y - centerY;
                            const sX = centerX + (relX * cos - relY * sin), sY = centerY + (relX * sin + relY * cos);
                            drawSingleShape(ctx, sh, sX, sY, sh.rotation + (i * (360/sym)), isSelected);
                        }
                    }
                });

                // Lignes droites
                userLines.forEach(line => {
                    const sym = line.symmetry || 8;
                    const angleStep = (Math.PI * 2) / sym;
                    ctx.strokeStyle = line.color; ctx.lineWidth = (line.strokeWidth || 2) / zoomLevel;

                    if (line.isFree) {
                        ctx.beginPath(); ctx.moveTo(line.x1, line.y1); ctx.lineTo(line.x2, line.y2); ctx.stroke();
                    } else {
                        for (let i = 0; i < sym; i++) {
                            const angle = i * angleStep; const cos = Math.cos(angle), sin = Math.sin(angle);
                            const sX1 = centerX + ((line.x1 - centerX) * cos - (line.y1 - centerY) * sin), sY1 = centerY + ((line.x1 - centerX) * sin + (line.y1 - centerY) * cos);
                            const sX2 = centerX + ((line.x2 - centerX) * cos - (line.y2 - centerY) * sin), sY2 = centerY + ((line.x2 - centerX) * sin + (line.y2 - centerY) * cos);
                            ctx.beginPath(); ctx.moveTo(sX1, sY1); ctx.lineTo(sX2, sY2); ctx.stroke();
                        }
                    }
                });

                // Arcs
                userArcs.forEach(arc => {
                    const sym = arc.symmetry || 8;
                    const angleStep = (Math.PI * 2) / sym;
                    ctx.strokeStyle = arc.color; ctx.lineWidth = (arc.strokeWidth || 2) / zoomLevel;

                    if (arc.isFree) {
                        ctx.beginPath(); ctx.moveTo(arc.x1, arc.y1); ctx.quadraticCurveTo(arc.cx, arc.cy, arc.x2, arc.y2); ctx.stroke();
                    } else {
                        for (let i = 0; i < sym; i++) {
                            const angle = i * angleStep; const cos = Math.cos(angle), sin = Math.sin(angle);
                            const r1x = arc.x1 - centerX, r1y = arc.y1 - centerY;
                            const r2x = arc.x2 - centerX, r2y = arc.y2 - centerY;
                            const rcx = arc.cx - centerX, rcy = arc.cy - centerY;

                            const sX1 = centerX + (r1x * cos - r1y * sin), sY1 = centerY + (r1x * sin + r1y * cos);
                            const sX2 = centerX + (r2x * cos - r2y * sin), sY2 = centerY + (r2x * sin + r2y * cos);
                            const sCx = centerX + (rcx * cos - rcy * sin), sCy = centerY + (rcx * sin + rcy * cos);

                            ctx.beginPath(); ctx.moveTo(sX1, sY1); ctx.quadraticCurveTo(sCx, sCy, sX2, sY2); ctx.stroke();
                        }
                    }
                });

                // Pinceau symétrique
                brushStrokes.forEach(stroke => {
                    if (!stroke.points || stroke.points.length < 2) return;
                    const sym = stroke.symmetry || 8;
                    const angleStep = (Math.PI * 2) / sym;

                    for (let i = 0; i < sym; i++) {
                        const angle = i * angleStep; const cos = Math.cos(angle), sin = Math.sin(angle);
                        ctx.strokeStyle = stroke.color; ctx.lineWidth = stroke.size / zoomLevel; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                        for (let p = 0; p < stroke.points.length - 1; p++) {
                            const pt1 = stroke.points[p], pt2 = stroke.points[p+1];
                            const sX1 = centerX + ((pt1.x - centerX) * cos - (pt1.y - centerY) * sin), sY1 = centerY + ((pt1.x - centerX) * sin + (pt1.y - centerY) * cos);
                            const sX2 = centerX + ((pt2.x - centerX) * cos - (pt2.y - centerY) * sin), sY2 = centerY + ((pt2.x - centerX) * sin + (pt2.y - centerY) * cos);
                            ctx.beginPath(); ctx.moveTo(sX1, sY1); ctx.lineTo(sX2, sY2); ctx.stroke();
                        }
                    }
                });

                // Pinceau libre
                freeBrushStrokes.forEach(stroke => {
                    if (!stroke.points || stroke.points.length < 2) return;
                    ctx.strokeStyle = stroke.color; ctx.lineWidth = stroke.size / zoomLevel; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                    for (let p = 0; p < stroke.points.length - 1; p++) {
                        ctx.beginPath(); ctx.moveTo(stroke.points[p].x, stroke.points[p].y); ctx.lineTo(stroke.points[p+1].x, stroke.points[p+1].y); ctx.stroke();
                    }
                });

                // Indicateurs visuels en cours de tracé
                if (drawingState === 1 && currentMode === 'drawLine') {
                    ctx.strokeStyle = lineColorPicker.value; ctx.lineWidth = 1.5 / zoomLevel;
                    ctx.beginPath(); ctx.arc(tempStart.x, tempStart.y, 4, 0, Math.PI * 2); ctx.stroke();
                } else if (drawingState === 1 && currentMode === 'drawArc') {
                    ctx.strokeStyle = lineColorPicker.value; ctx.lineWidth = 1.5 / zoomLevel;
                    ctx.beginPath(); ctx.arc(tempStart.x, tempStart.y, 4, 0, Math.PI * 2); ctx.stroke();
                } else if (drawingState === 2 && currentMode === 'drawArc') {
                    ctx.strokeStyle = lineColorPicker.value; ctx.lineWidth = 1.5 / zoomLevel;
                    ctx.beginPath(); ctx.arc(tempStart.x, tempStart.y, 4, 0, Math.PI * 2); ctx.stroke();
                    ctx.beginPath(); ctx.arc(tempMid.x, tempMid.y, 4, 0, Math.PI * 2); ctx.stroke();
                }

                    ctx.restore();
                zoomInfo.textContent = `Mode: ${currentMode} | Zoom: ${Math.round(zoomLevel * 100)}%`;
            } catch (err) { console.error("Erreur redraw:", err); }
        }

        function getShapePoints(type, x, y, size, rotationDeg = 0) {
            let pts = []; 
            const rad = (rotationDeg * Math.PI) / 180;
            const r = size / 2;
            const rot = (px, py) => ({ 
                x: x + (px * Math.cos(rad) - py * Math.sin(rad)), 
                y: y + (px * Math.sin(rad) + py * Math.cos(rad)) 
            });

            if (type === 'square') {
                [ {x:-r, y:-r}, {x:r, y:-r}, {x:r, y:r}, {x:-r, y:r} ].forEach(c => pts.push(rot(c.x, c.y)));
            } else if (type === 'triangle') {
                [ {x:0, y:-r}, {x:r, y:r}, {x:-r, y:r} ].forEach(c => pts.push(rot(c.x, c.y)));
            } else if (type === 'diamond') {
                [ {x:0, y:-r}, {x:r, y:0}, {x:0, y:r}, {x:-r, y:0} ].forEach(c => pts.push(rot(c.x, c.y)));
            } else if (type === 'hexagon') {
                for (let j = 0; j < 6; j++) { const a = (j * 2 * Math.PI) / 6; pts.push(rot(r * Math.cos(a), r * Math.sin(a))); }
            } else if (type === 'octagon') {
                for (let j = 0; j < 8; j++) { const a = (j * 2 * Math.PI) / 8; pts.push(rot(r * Math.cos(a), r * Math.sin(a))); }
            } else if (type === 'star5') {
                for (let j = 0; j < 10; j++) { const dist = j % 2 === 0 ? r : r / 2; const a = (j * Math.PI) / 5 - Math.PI / 2; pts.push(rot(dist * Math.cos(a), dist * Math.sin(a))); }
            } else if (type === 'star6') {
                for (let j = 0; j < 12; j++) { const dist = j % 2 === 0 ? r : r / 1.7; const a = (j * Math.PI) / 6; pts.push(rot(dist * Math.cos(a), dist * Math.sin(a))); }
            } else if (type === 'rosace') {
                for (let j = 0; j < 32; j++) { const a = (j * 2 * Math.PI) / 32; const dist = r * (0.8 + 0.2 * Math.cos(6 * a)); pts.push(rot(dist * Math.cos(a), dist * Math.sin(a))); }
            }
            return pts;
        }

        function getCanvasPoint(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            // Ajustement par rapport à la taille réelle d'affichage CSS vs taille interne du canvas
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const internalX = x * scaleX;
            const internalY = y * scaleY;

            const unX = (internalX - canvas.width / 2 - panX) / zoomLevel;
            const unY = (internalY - canvas.height / 2 - panY) / zoomLevel;
            
            const cos = Math.cos(-globalRotationAngle);
            const sin = Math.sin(-globalRotationAngle);
            
            return {
                x: centerX + (unX * cos - unY * sin),
                y: centerY + (unX * sin + unY * cos)
            };
        }

        // Gestion unifiée Souris & Tactile
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 1 || e.button === 2) {
                isPanning = true; startX = e.clientX - panX; startY = e.clientY - panY; return;
            }
            handleInteractionStart(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                handleInteractionStart(touch.clientX, touch.clientY);
                e.preventDefault();
            }
        }, { passive: false });

        function handleInteractionStart(clientX, clientY) {
            const pt = getCanvasPoint(clientX, clientY);

            if (currentMode === 'place') {
                saveState();
                addShape(
                    shapeSelect.value, 
                    pt.x, 
                    pt.y, 
                    parseInt(shapeSizeRange.value), 
                    parseInt(shapeRotationRange.value), 
                    parseInt(strokeWidthRange.value), 
                    lineColorPicker.value,
                    isFreePlacementCheckbox.checked,
                    parseInt(symmetryRange.value)
                );
                redraw();
            } else if (currentMode === 'select') {
                let found = -1;

                shapes.forEach((sh, idx) => {
                    const sym = sh.symmetry || 8;
                    const angleStep = (Math.PI * 2) / sym;

                    if (sh.isFree) {
                        if (Math.hypot(pt.x - sh.x, pt.y - sh.y) < sh.size / 2) found = idx;
                    } else {
                        for (let i = 0; i < sym; i++) {
                            const angle = i * angleStep; const cos = Math.cos(angle), sin = Math.sin(angle);
                            const relX = sh.x - centerX, relY = sh.y - centerY;
                            const sX = centerX + (relX * cos - relY * sin), sY = centerY + (relX * sin + relY * cos);
                            if (Math.hypot(pt.x - sX, pt.y - sY) < sh.size / 2) {
                                found = idx;
                                break;
                            }
                        }
                    }
                });

                if (found !== -1) {
                    selectedShapeIdx = found;
                    isDraggingShape = true;
                    selectedControls.style.display = 'block';
                    saveState();
                    redraw();
                } else {
                    clearSelection();
                    redraw();
                }
            } else if (currentMode === 'drawLine') {
                if (drawingState === 0) {
                    tempStart = pt; drawingState = 1; redraw();
                } else {
                    saveState();
                    userLines.push({ 
                        x1: tempStart.x, y1: tempStart.y, 
                        x2: pt.x, y2: pt.y, 
                        color: lineColorPicker.value, 
                        strokeWidth: parseInt(strokeWidthRange.value),
                        isFree: isFreePlacementCheckbox.checked,
                        symmetry: parseInt(symmetryRange.value) 
                    });
                    drawingState = 0; redraw();
                }
            } else if (currentMode === 'drawArc') {
                if (drawingState === 0) {
                    tempStart = pt; drawingState = 1; redraw();
                } else if (drawingState === 1) {
                    tempMid = pt; drawingState = 2; redraw();
                } else {
                    saveState();
                    userArcs.push({ 
                        x1: tempStart.x, y1: tempStart.y, 
                        cx: tempMid.x, cy: tempMid.y, 
                        x2: pt.x, y2: pt.y, 
                        color: lineColorPicker.value, 
                        strokeWidth: parseInt(strokeWidthRange.value),
                        isFree: isFreePlacementCheckbox.checked,
                        symmetry: parseInt(symmetryRange.value) 
                    });
                    drawingState = 0; redraw();
                }
            } else if (currentMode === 'colorize') {
                saveState();
                isPainting = true;
                currentBrushStroke = { color: lineColorPicker.value, size: parseInt(brushSizeRange.value), points: [pt], symmetry: parseInt(symmetryRange.value) };
                brushStrokes.push(currentBrushStroke);
                redraw();
            } else if (currentMode === 'freeBrush') {
                saveState();
                isPainting = true;
                currentBrushStroke = { color: lineColorPicker.value, size: parseInt(brushSizeRange.value), points: [pt] };
                freeBrushStrokes.push(currentBrushStroke);
                redraw();
            } else if (currentMode === 'erase') {
                if (checkAndRemoveAnything(pt)) {
                    saveState();
                    redraw();
                }
            }
        }

        canvas.addEventListener('mousemove', (e) => {
            handleInteractionMove(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                handleInteractionMove(touch.clientX, touch.clientY);
                e.preventDefault();
            }
        }, { passive: false });

        function handleInteractionMove(clientX, clientY) {
            const pt = getCanvasPoint(clientX, clientY);
            if (isPanning) {
                panX = clientX - startX; panY = clientY - startY; redraw();
            } else if (currentMode === 'select' && isDraggingShape && selectedShapeIdx !== null) {
                const sh = shapes[selectedShapeIdx];
                if (sh) {
                    sh.x = pt.x;
                    sh.y = pt.y;
                    redraw();
                }
            } else if ((currentMode === 'colorize' || currentMode === 'freeBrush') && isPainting && currentBrushStroke) {
                currentBrushStroke.points.push(pt);
                redraw();
            }
        }

        window.addEventListener('mouseup', () => { 
            isPanning = false; isDraggingShape = false; isPainting = false; currentBrushStroke = null;
        });

        window.addEventListener('touchend', () => {
            isPanning = false; isDraggingShape = false; isPainting = false; currentBrushStroke = null;
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoomLevel = Math.max(0.2, Math.min(5, zoomLevel * (e.deltaY < 0 ? 1.1 : 0.9)));
            redraw();
        }, { passive: false });

        deleteSelectedBtn.addEventListener('click', () => {
            if (selectedShapeIdx !== null) {
                saveState();
                shapes.splice(selectedShapeIdx, 1);
                clearSelection();
                redraw();
            }
        });

        [shapeSizeRange, shapeRotationRange, strokeWidthRange, brushSizeRange, lineColorPicker, bgColorSelect].forEach(el => {
            el.addEventListener('input', redraw);
        });

        symmetryRange.addEventListener('input', () => {
            symVal.textContent = symmetryRange.value;
        });

        resetAllBtn.addEventListener('click', () => {
            saveState();
            shapes = []; brushStrokes = []; freeBrushStrokes = []; userLines = []; userArcs = [];
            clearSelection(); zoomLevel = 1; panX = 0; panY = 0; isPlaying = false;
            playAnimBtn.textContent = "▶️ Play / Pause"; playAnimBtn.style.background = '';
            redraw();
        });

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a'); link.download = 'mandala-studio.png';
            link.href = canvas.toDataURL('image/png'); link.click();
        });

        redraw();
    </script>
</body>
</html>
